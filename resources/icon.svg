<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141B28"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="em" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5A0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none"
        stroke="#1E293B" stroke-width="5"/>

  <!-- sweep arc: the "clean" motion -->
  <path d="M112 350 A 148 148 0 0 1 400 350" fill="none"
        stroke="url(#em)" stroke-width="46" stroke-linecap="round"/>

  <!-- sparkle: the "optimised" result. Centre (368,138), clear of the arc's stroke
       (arc centreline sits at y~241 at this x; sparkle tip lands at y=202). -->
  <path d="M368 74 l17 47 47 17 -47 17 -17 47 -17 -47 -47 -17 47 -17 z"
        fill="#E8EEF7"/>
</svg>
